<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.5DUMLhtml · Isometric flow editor</title>

<!-- ===================================================================
     核心樣式：編輯器畫布與匯出的 HTML 檢視器共用（匯出時會整段複製過去）
     =================================================================== -->
<style id="core-css">
.iso-flow{stroke-dasharray:10 8;animation:isoFlow .7s linear infinite}
@keyframes isoFlow{to{stroke-dashoffset:-18}}
.iso-pulse{transform-box:fill-box;transform-origin:center;animation:isoPulse 1.6s ease-out infinite}
@keyframes isoPulse{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
.iso-node.on{transform:translateY(-6px)}
.iso-sel{stroke-dasharray:6 5;animation:isoFlow 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.iso-flow,.iso-pulse,.iso-sel{animation:none}}
</style>

<!-- ===================================================================
     編輯器介面樣式
     =================================================================== -->
<style>
:root{--bg:#f4efe4;--card:#fbf8f1;--ink:#2d2a24;--muted:#7a7366;--soft:#e4dccb;--accent:#2f7fd6;--dot:#e2d9c6;
  --mono:"Cascadia Mono",Consolas,"Microsoft JhengHei",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;height:100vh;grid-template-columns:200px minmax(0,1fr) 340px;grid-template-rows:50px minmax(0,1fr) 96px;
  grid-template-areas:"tb tb tb" "left stage right" "left tl right"}
#app.hideL{grid-template-columns:0 minmax(0,1fr) 340px}
#app.hideR{grid-template-columns:200px minmax(0,1fr) 0}
#app.hideL.hideR{grid-template-columns:0 minmax(0,1fr) 0}
.tb{grid-area:tb;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:2px solid var(--soft);background:var(--card);overflow-x:auto;white-space:nowrap}
.tb .logo{font-weight:700;font-size:15px;margin-right:2px}
#langSel{padding:3px 6px;margin-right:6px}
.tb .sep{width:2px;height:24px;background:var(--soft);margin:0 4px;flex:none}
.btn{border:2px solid var(--ink);border-radius:8px;background:var(--card);padding:4px 10px;cursor:pointer;font-weight:700;flex:none}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 7px;font-size:12px;border-width:1.5px}
.btn:disabled{opacity:.4;cursor:default}
#zoomLbl{min-width:58px;text-align:center}
#left{grid-area:left;border-right:2px solid var(--soft);background:var(--card);overflow:auto;padding:10px}
#right{grid-area:right;border-left:2px solid var(--soft);background:var(--card);overflow:auto;display:flex;flex-direction:column}
#app.hideL #left,#app.hideR #right{display:none}
.sec{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:12px 0 6px;font-weight:700}
.sec:first-child{margin-top:0}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{border:2px solid var(--soft);border-radius:10px;background:var(--bg);padding:6px 4px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;touch-action:none}
.pal button:hover{border-color:var(--accent)}
.pal svg{width:64px;height:52px;pointer-events:none}
#stage{grid-area:stage;position:relative;overflow:hidden;background:radial-gradient(circle,var(--dot) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
#cv .iso-node,#cv .iso-plate{cursor:move}
#cv .iso-hit{cursor:pointer}
#cv [data-handle]{cursor:crosshair}
#cv [data-handle^="p"]{cursor:nwse-resize}
#stage.panning #cv,#stage.panning #cv *{cursor:grabbing!important}
#hint{position:absolute;left:10px;bottom:8px;right:10px;font-size:11.5px;color:var(--muted);pointer-events:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.92}
#tl{grid-area:tl;border-top:2px solid var(--soft);background:var(--card);padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
#tl .tlh{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
#tlSteps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}
.tls{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--soft);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;background:var(--bg)}
.tls b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px}
.tls.on{border-color:var(--ink);font-weight:700}
.tabs{display:flex;border-bottom:2px solid var(--soft);flex:none}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#panel{padding:12px 14px 30px;overflow:auto;flex:1}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.f>span{font-size:11px;color:var(--muted);font-weight:700}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;border:1.5px solid var(--soft);border-radius:7px;background:var(--bg);padding:5px 7px}
.f textarea{resize:vertical;min-height:60px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw button{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw button.auto{background:linear-gradient(135deg,var(--card) 45%,#d64545 47%,#d64545 53%,var(--card) 55%)}
.sw input[type=color]{width:30px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.rng{display:flex;align-items:center;gap:8px}.rng input{flex:1}.rng em{font-style:normal;min-width:40px;text-align:right}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:6px;border:1.5px solid var(--soft);border-radius:8px;padding:4px 6px;background:var(--bg);cursor:pointer}
.li.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li button{border:0;background:none;cursor:pointer;padding:0 3px;font-size:13px;color:var(--muted)}
.li button:hover{color:var(--ink)}
.hop{display:grid;grid-template-columns:1fr 86px auto;gap:4px;align-items:center;border:1.5px solid var(--soft);border-radius:8px;padding:4px 6px;margin-bottom:4px;background:var(--bg)}
.hop .p{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hop input{width:100%;border:1.5px solid var(--soft);border-radius:6px;background:var(--card);padding:2px 5px;font-size:12px}
.hop .ops{display:flex}.hop .ops button{border:0;background:none;cursor:pointer;padding:0 3px;color:var(--muted)}
.hop .ops button:hover{color:var(--ink)}
.addhop{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px;align-items:center}
.addhop select{border:1.5px solid var(--soft);border-radius:6px;background:var(--bg);padding:3px;min-width:0}
.keys{line-height:1.9;font-size:12px}
.keys kbd{border:1.5px solid var(--soft);border-bottom-width:3px;border-radius:5px;padding:0 5px;background:var(--bg);font-family:inherit;font-size:11px}
.menu{position:fixed;z-index:20;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{border:0;background:none;text-align:left;padding:6px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu small{display:block;color:var(--muted);font-size:11px}
#ov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#ov[hidden]{display:none}
#ov .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--soft);background:var(--card)}
#ov iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div id="app">
  <div class="tb">
    <span class="logo">🧊 2.5DUMLhtml</span>
    <select class="btn" id="langSel" data-i18n-title="app.lang" title="Language"></select>
    <button class="btn" id="bTpl" data-i18n="tb.tpl" data-i18n-title="tb.tplTitle">Templates ▾</button>
    <button class="btn" id="bOpen" data-i18n="tb.open" data-i18n-title="tb.openTitle">Open</button>
    <button class="btn" id="bSave" data-i18n="tb.save" data-i18n-title="tb.saveTitle">Save JSON</button>
    <button class="btn" id="bHtml" data-i18n="tb.html" data-i18n-title="tb.htmlTitle">Export HTML</button>
    <button class="btn" id="bPng" data-i18n="tb.png" data-i18n-title="tb.pngTitle">Export PNG</button>
    <span class="sep"></span>
    <button class="btn" id="bUndo" data-i18n-title="tb.undo">↶</button>
    <button class="btn" id="bRedo" data-i18n-title="tb.redo">↷</button>
    <span class="sep"></span>
    <button class="btn" id="bRotL" data-i18n-title="tb.rotL">⟲</button>
    <button class="btn" id="bRotR" data-i18n-title="tb.rotR">⟳</button>
    <button class="btn" id="bFit" data-i18n="tb.fit" data-i18n-title="tb.fitTitle">Fit</button>
    <button class="btn" id="zoomLbl" data-i18n-title="tb.zoom100">100%</button>
    <select class="btn" id="selTheme" data-i18n-title="tb.theme"></select>
    <span class="sep"></span>
    <button class="btn" id="bSideL" data-i18n-title="tb.sideL">☰</button>
    <button class="btn" id="bSideR" data-i18n-title="tb.sideR">◧</button>
    <button class="btn pri" id="bPlay" data-i18n="tb.play" data-i18n-title="tb.playTitle">▶ Play preview</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>

  <aside id="left">
    <div class="sec" data-i18n="left.shapes">SHAPES (click or drag onto the canvas)</div>
    <div class="pal" id="pal"></div>
    <div class="sec" data-i18n="left.zones">ZONES</div>
    <div class="pal" id="pal2"></div>
  </aside>

  <main id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint"></div>
    <div id="toast"></div>
  </main>

  <aside id="right">
    <div class="tabs" id="tabs">
      <button data-tab="prop" class="on" data-i18n="tab.prop">Properties</button>
      <button data-tab="step" data-i18n="tab.step">Steps</button>
      <button data-tab="doc" data-i18n="tab.doc">Document</button>
    </div>
    <div id="panel"></div>
  </aside>

  <footer id="tl">
    <div class="tlh"><b style="color:var(--ink)" data-i18n="tl.title">Step timeline</b><span id="tlInfo"></span>
      <button class="btn sm" id="bAddStep" style="margin-left:auto" data-i18n="tl.add">＋ Add step</button></div>
    <div id="tlSteps"></div>
  </footer>
</div>

<div id="ov" hidden>
  <div class="bar"><b data-i18n="tb.play">▶ Play preview</b><span class="muted" data-i18n="ov.note">This is exactly what "Export HTML" produces</span>
    <button class="btn" id="ovClose" style="margin-left:auto" data-i18n="ov.close">✕ Back to editor (Esc)</button></div>
  <iframe id="ovf" data-i18n-title="tb.play" title="Play preview"></iframe>
</div>

<!-- ===================================================================
     核心：等角投影、圖形、渲染、相機。匯出的 HTML 檢視器會整段複製這支 script。
     （這段裡面不能出現 script 結尾標籤，否則匯出會斷掉）
     =================================================================== -->
<script id="core">
const ISO = (() => {
'use strict';
const C = Math.cos(Math.PI / 6), S = 0.5;

const STEP_TYPES = {
  req:    { c: '#2f7fd6', n: 'request' },
  crypto: { c: '#e8871a', n: 'crypto' },
  ext:    { c: '#8a5cd6', n: 'external' },
  resp:   { c: '#2e9e5b', n: 'response' },
  err:    { c: '#d64545', n: 'error' },
  job:    { c: '#6b7a8f', n: 'other' },
};
const THEMES = {
  paper: { name: 'Paper', bg: '#f4efe4', card: '#fbf8f1', ink: '#2d2a24', muted: '#7a7366', soft: '#e4dccb', dot: '#e2d9c6',
           stroke: '#2d2a24', plate: '#ece5d5', grid: '#dcd3bf', plateText: '#8f8572', pill: '#fffdf8',
           edge: '#8a8172', future: '#bdb39f', accent: '#2f7fd6' },
  night: { name: 'Night', bg: '#1b1e25', card: '#232731', ink: '#e9e5db', muted: '#9aa1ad', soft: '#353a46', dot: '#2c313b',
           stroke: '#0c0e12', plate: '#2a2f3a', grid: '#363c4a', plateText: '#8d95a5', pill: '#2a2f39',
           edge: '#9aa1ad', future: '#4a5060', accent: '#6aa8ff' },
};
Object.assign(THEMES, {
  light:     { name: 'Light', bg: '#f4f6fa', card: '#ffffff', ink: '#1c2331', muted: '#6b7688', soft: '#d8dee8', dot: '#e2e7f0',
               stroke: '#2a3242', plate: '#e9edf4', grid: '#d5dce8', plateText: '#8a94a6', pill: '#ffffff',
               edge: '#69748a', future: '#c3cad6', accent: '#2f6fe0' },
  midnight:  { name: 'Midnight', bg: '#12151c', card: '#1a1f2b', ink: '#e6ebf5', muted: '#8b95ab', soft: '#2e3648', dot: '#232a39',
               stroke: '#0a0c10', plate: '#202736', grid: '#2c3447', plateText: '#7d88a0', pill: '#222836',
               edge: '#8d9ab5', future: '#3a4458', accent: '#4c8dff' },
  graphite:  { name: 'Graphite', bg: '#17181a', card: '#1f2123', ink: '#ececed', muted: '#9a9ea3', soft: '#3a3e42', dot: '#2a2d30',
               stroke: '#0b0c0d', plate: '#26292c', grid: '#34383c', plateText: '#8a8f95', pill: '#292c2f',
               edge: '#9aa0a6', future: '#45494e', accent: '#f0a03c' },
  blueprint: { name: 'Blueprint', bg: '#0a2444', card: '#0d2e56', ink: '#dbeaff', muted: '#7fa8d6', soft: '#1d4f80', dot: '#164274',
               stroke: '#061a33', plate: '#0f3463', grid: '#1d4f80', plateText: '#7fa8d6', pill: '#12385f',
               edge: '#9fd0ff', future: '#2a5a8c', accent: '#4fd1e6' },
  forest:    { name: 'Forest', bg: '#101a15', card: '#16241d', ink: '#e2f0e7', muted: '#84a394', soft: '#2b4438', dot: '#1e3129',
               stroke: '#07100b', plate: '#1b2c23', grid: '#29413a', plateText: '#7c9a8c', pill: '#1d2f26',
               edge: '#8bb5a0', future: '#34503f', accent: '#4ec98a' },
});
const THEME_ORDER = ['paper', 'light', 'night', 'midnight', 'graphite', 'blueprint', 'forest'];

/* 自訂主題：只調 6 個主色，其餘次要色自動推導 */
const CUSTOM_FIELDS = [['bg', 'Canvas'], ['ink', 'Text'], ['accent', 'Accent'], ['plate', 'Zone plate'], ['edge', 'Lines'], ['stroke', 'Shape outline']];
const TXT = { untitled: 'Untitled' };   // 編輯器會依語言改掉
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const pa = hexRgb(a), pb = hexRgb(b); return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const lum = h => { const [r, g, b] = hexRgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
function customFrom(key) { const t = THEMES[key] || THEMES.paper; const o = {}; CUSTOM_FIELDS.forEach(([k]) => o[k] = t[k]); return o; }
function expandCustom(c) {
  const { bg, ink, plate, edge } = c, dark = lum(bg) < 0.45;
  return { name: 'Custom', bg, ink, accent: c.accent, plate, edge, stroke: c.stroke,
    card: dark ? mixHex(bg, '#ffffff', .04) : mixHex(bg, '#ffffff', .55), muted: mixHex(ink, bg, .42), soft: mixHex(bg, ink, .15),
    dot: mixHex(bg, ink, .09), grid: mixHex(plate, ink, .12), plateText: mixHex(plate, ink, .45),
    pill: dark ? mixHex(bg, ink, .08) : mixHex(bg, '#ffffff', .75), future: mixHex(edge, bg, .55) };
}
const themeOf = doc => (doc.theme === 'custom' && doc.customTheme) ? expandCustom(doc.customTheme) : (THEMES[doc.theme] || THEMES.paper);

const SHAPE_INK = '#2d2a24';   // 畫在彩色圖形頂面上的字，所有主題都用深色

const isHex = c => /^#[0-9a-f]{6}$/i.test(c || '');
function shade(hex, f) {
  if (!isHex(hex)) hex = '#999999';
  const n = parseInt(hex.slice(1), 16);
  const ch = [n >> 16, (n >> 8) & 255, n & 255].map(v =>
    Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f))));
  return `rgb(${ch.join(',')})`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const textW = (t, size = 13) => [...String(t ?? '')].reduce((s, c) => s + (c.charCodeAt(0) > 255 ? size * 1.05 : size * 0.6), 0);
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);

/* ---------- 投影：世界座標 (x, y, z) → 畫面；rot 是 90° 視角旋轉次數 ---------- */
function proj(rot) {
  rot = (((rot | 0) % 4) + 4) % 4;
  const R  = (x, y) => { for (let i = 0; i < rot; i++) { const t = x; x = -y; y = t; } return [x, y]; };
  const Ri = (x, y) => { for (let i = 0; i < rot; i++) { const t = x; x = y; y = -t; } return [x, y]; };
  const P0 = (a, b, z = 0) => [(a - b) * C, (a + b) * S - z];
  return {
    rot, R, Ri, P0,
    P: (x, y, z = 0) => { const r = R(x, y); return P0(r[0], r[1], z); },
    un: (sx, sy) => Ri((sx / C + sy / S) / 2, (sy / S - sx / C) / 2),   // 畫面點 → 地面 (z=0) 世界座標
    depth: (x, y) => { const r = R(x, y); return r[0] + r[1]; },
  };
}

/* ---------- 繪圖工具：會順便記錄內容邊界 ---------- */
let gradSeq = 0;
function Draw(pj, th) {
  const d = { defs: '', stroke: th.stroke, bb: [Infinity, Infinity, -Infinity, -Infinity], depth: pj.depth };
  const grow = (x, y) => { const b = d.bb; if (x < b[0]) b[0] = x; if (y < b[1]) b[1] = y; if (x > b[2]) b[2] = x; if (y > b[3]) b[3] = y; };
  const P0 = (a, b, z = 0) => { const p = pj.P0(a, b, z); grow(p[0], p[1]); return p; };
  d.grow = grow; d.P0 = P0;
  d.P = (x, y, z = 0) => { const r = pj.R(x, y); return P0(r[0], r[1], z); };
  d.pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const sw = `stroke="${th.stroke}" stroke-width="1.6" stroke-linejoin="round"`;

  /* 任意多邊形擠出成柱體：只畫朝向鏡頭的側面，依深度排序 */
  d.prism = (poly, z0, h, color) => {
    const rp = poly.map(p => pj.R(p[0], p[1]));
    const cx = rp.reduce((s, p) => s + p[0], 0) / rp.length, cy = rp.reduce((s, p) => s + p[1], 0) / rp.length;
    const faces = [];
    rp.forEach((a, i) => {
      const b = rp[(i + 1) % rp.length];
      let nx = b[1] - a[1], ny = -(b[0] - a[0]);
      if (nx * ((a[0] + b[0]) / 2 - cx) + ny * ((a[1] + b[1]) / 2 - cy) < 0) { nx = -nx; ny = -ny; }
      const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      if (nx + ny > 1e-6) faces.push({ a, b, nx, ny, z0, h, dp: a[0] + b[0] + a[1] + b[1] });
    });
    faces.sort((p, q) => p.dp - q.dp);
    let s = '';
    for (const f of faces) {
      const q = [P0(f.a[0], f.a[1], z0), P0(f.b[0], f.b[1], z0), P0(f.b[0], f.b[1], z0 + h), P0(f.a[0], f.a[1], z0 + h)];
      s += `<polygon points="${d.pts(q)}" fill="${shade(color, 0.74 + 0.13 * (f.ny - f.nx))}" ${sw}/>`;
    }
    s += `<polygon points="${d.pts(rp.map(p => P0(p[0], p[1], z0 + h)))}" fill="${shade(color, 1.18)}" ${sw}/>`;
    return { svg: s, faces };
  };
  /* 側面上的一塊內嵌四邊形（手機螢幕、機櫃溝槽用） */
  d.inset = (f, u0, u1, z0, z1) => {
    const L = u => [f.a[0] + (f.b[0] - f.a[0]) * u, f.a[1] + (f.b[1] - f.a[1]) * u];
    const p = L(u0), q = L(u1);
    return d.pts([P0(p[0], p[1], z0), P0(q[0], q[1], z0), P0(q[0], q[1], z1), P0(p[0], p[1], z1)]);
  };
  d.cyl = (x, y, r, z0, h, color, band = true) => {
    const [sx, sy] = d.P(x, y, z0);
    const rx = r * C * Math.SQRT2, ry = r * S * Math.SQRT2, ty = sy - h;
    grow(sx - rx, ty - ry); grow(sx + rx, sy + ry);
    const id = 'isog' + (gradSeq++);
    d.defs += `<linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${shade(color, .95)}"/><stop offset=".35" stop-color="${shade(color, 1.12)}"/><stop offset="1" stop-color="${shade(color, .7)}"/></linearGradient>`;
    const by = sy - h * 0.42;
    return `<path d="M${sx - rx},${ty} L${sx - rx},${sy} A${rx},${ry} 0 0 0 ${sx + rx},${sy} L${sx + rx},${ty} Z" fill="url(#${id})" ${sw}/>` +
      (band ? `<path d="M${sx - rx},${by} A${rx},${ry} 0 0 0 ${sx + rx},${by}" fill="none" stroke="${th.stroke}" stroke-width="1.3" opacity=".55"/>` : '') +
      `<ellipse cx="${sx}" cy="${ty}" rx="${rx}" ry="${ry}" fill="${shade(color, 1.22)}" ${sw}/>`;
  };
  d.text = (x, y, z, t, size = 13, weight = 700, fill = SHAPE_INK) => {
    const [sx, sy] = d.P(x, y, z);
    return `<text x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" font-weight="${weight}" fill="${fill}">${esc(t)}</text>`;
  };
  return d;
}

/* ---------- 圖形定義 ----------
   foot：地面佔用半徑（標籤位置、選取圈、脈衝圈用）
   top(n)：頂面高度（圖示放這裡；連線接在 top/2） */
const rect = (x, y, w, dd) => [[x, y], [x + w, y], [x + w, y + dd], [x, y + dd]];
const longest = faces => faces.reduce((m, f) => Math.hypot(f.b[0] - f.a[0], f.b[1] - f.a[1]) > Math.hypot(m.b[0] - m.a[0], m.b[1] - m.a[1]) ? f : m);
const SHAPES = {
  hex:    { name: 'App', desc: 'hex prism', def: { color: '#9cc3ec', h: 48, icon: '⚙' }, foot: 58, top: n => n.h,
            draw: (d, n, s) => d.prism([0, 1, 2, 3, 4, 5].map(k => [n.x + 58 * s * Math.cos(k * Math.PI / 3), n.y + 58 * s * Math.sin(k * Math.PI / 3)]), 0, n.h, n.color).svg },
  box:    { name: 'Service', desc: 'block', def: { color: '#f0b070', h: 58, icon: '🔐' }, foot: 42, top: n => n.h,
            draw: (d, n, s) => d.prism(rect(n.x - 42 * s, n.y - 42 * s, 84 * s, 84 * s), 0, n.h, n.color).svg },
  cyl:    { name: 'Database', desc: 'cylinder', def: { color: '#8fd0a8', h: 84, icon: '🛢' }, foot: 50, top: n => n.h,
            draw: (d, n, s) => d.cyl(n.x, n.y, 50 * s, 0, n.h, n.color) },
  server: { name: 'Server', desc: 'rack', def: { color: '#c9d3e0', h: 110, icon: '🖥' }, foot: 42, top: n => n.h,
            draw: (d, n, s) => {
              const pr = d.prism(rect(n.x - 35 * s, n.y - 25 * s, 70 * s, 50 * s), 0, n.h, n.color); let o = pr.svg;
              for (const f of pr.faces) for (let i = 1; i <= 4; i++) { const z = n.h * i / 5; o += `<polygon points="${d.inset(f, .12, .88, z - 3, z + 1)}" fill="${shade(n.color, .45)}"/>`; }
              return o; } },
  phone:  { name: 'Client', desc: 'phone', def: { color: '#f2c98a', h: 92, icon: '📱' }, foot: 30, top: n => n.h + 14,
            draw: (d, n, s) => {
              const pr = d.prism(rect(n.x - 25 * s, n.y - 7 * s, 50 * s, 14 * s), 0, n.h, n.color);
              return pr.svg + `<polygon points="${d.inset(longest(pr.faces), .12, .88, 12, n.h - 10)}" fill="#2b3a55" stroke="${d.stroke}" stroke-width="1.2"/>`; } },
  desktop: { name: 'Client', desc: 'desktop', def: { color: '#cfd6de', h: 84, icon: '' }, foot: 50, top: n => n.h,
            draw: (d, n, s) => {
              const neck = n.h * 0.32;
              let o = d.prism(rect(n.x - 24 * s, n.y - 16 * s, 48 * s, 32 * s), 0, 5, shade(n.color, .85)).svg;   // 底座
              o += d.prism(rect(n.x - 4 * s, n.y - 3 * s, 8 * s, 6 * s), 5, neck - 5, shade(n.color, .8)).svg;    // 支架
              const scr = d.prism(rect(n.x - 50 * s, n.y - 5 * s, 100 * s, 10 * s), neck, n.h - neck, n.color);  // 螢幕
              return o + scr.svg + `<polygon points="${d.inset(longest(scr.faces), .06, .94, neck + 5, n.h - 5)}" fill="#2b3a55" stroke="${d.stroke}" stroke-width="1.2"/>`; } },
  gate:   { name: 'Gateway', desc: 'gate', def: { color: '#b9a6e8', h: 74, icon: 'GATEWAY' }, foot: 56, top: n => n.h + 16,
            draw: (d, n, s) => {
              const parts = [[n.x - 46 * s, n.y - 16 * s], [n.x + 30 * s, n.y - 16 * s]]
                .sort((p, q) => d.depth(p[0] + 8 * s, p[1] + 16 * s) - d.depth(q[0] + 8 * s, q[1] + 16 * s));
              return parts.map(p => d.prism(rect(p[0], p[1], 16 * s, 32 * s), 0, n.h, n.color).svg).join('') +
                d.prism(rect(n.x - 54 * s, n.y - 20 * s, 108 * s, 40 * s), n.h, 16, n.color).svg; } },
  users:  { name: 'Users', desc: 'crowd', def: { color: '#e9d8b4', h: 8, icon: '' }, foot: 62, top: n => n.h + 34,
            draw: (d, n, s) => {
              let o = d.prism(rect(n.x - 60 * s, n.y - 45 * s, 120 * s, 90 * s), 0, n.h, n.color).svg;
              const cols = ['#9cc3ec', '#f2c98a', '#b9a6e8', '#8fd0a8', '#f0b070', '#e8a0a0'], ppl = [];
              for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) ppl.push([n.x + (-36 + i * 36) * s, n.y + (-20 + j * 40) * s, cols[(i * 2 + j) % 6]]);
              ppl.sort((p, q) => d.depth(p[0], p[1]) - d.depth(q[0], q[1]));
              for (const [px, py, c] of ppl) {
                o += d.cyl(px, py, 7 * s, n.h, 18 * s, c, false);
                const [hx, hy] = d.P(px, py, n.h + 18 * s + 8 * s);
                o += `<circle cx="${hx}" cy="${hy}" r="${7 * s}" fill="${shade(c, 1.15)}" stroke="${d.stroke}" stroke-width="1.4"/>`;
              }
              return o; } },
  file:   { name: 'File', desc: 'file stack', def: { color: '#f5f1e6', h: 24, icon: '📄' }, foot: 48, top: n => n.h,
            draw: (d, n, s) => {
              let o = ''; const k = 3, t = n.h / k;
              for (let i = 0; i < k; i++) { const off = i * 4 * s; o += d.prism(rect(n.x - 36 * s + off, n.y - 46 * s - off, 72 * s, 92 * s), i * t, t - 1, i === k - 1 ? n.color : shade(n.color, .9)).svg; }
              return o; } },
};

/* ---------- 文件正規化：補預設值、清掉壞資料 ---------- */
let idSeq = 0;
const uid = p => p + Date.now().toString(36) + (idSeq++).toString(36) + Math.random().toString(36).slice(2, 5);
function normalize(raw) {
  const d = (raw && typeof raw === 'object') ? raw : {};
  const out = {
    v: 1, title: String(d.title ?? TXT.untitled), crumb: String(d.crumb ?? ''), subtitle: String(d.subtitle ?? ''),
    tags: Array.isArray(d.tags) ? d.tags.map(String) : [],
    cards: Array.isArray(d.cards) ? d.cards.map(c => ({ k: String(c.k ?? ''), v: String(c.v ?? ''), type: String(c.type ?? '') })) : [],
    theme: (THEMES[d.theme] || d.theme === 'custom') ? d.theme : 'paper', customTheme: null, rot: (((d.rot | 0) % 4) + 4) % 4,
    speed: num(d.speed, 1100), autoplay: d.autoplay !== false,
    plates: [], nodes: [], edges: [], steps: [],
  };
  const ct = (d.customTheme && typeof d.customTheme === 'object') ? d.customTheme : {}, base = customFrom('paper');
  out.customTheme = { edited: !!ct.edited };
  CUSTOM_FIELDS.forEach(([k]) => out.customTheme[k] = isHex(ct[k]) ? ct[k].toLowerCase() : base[k]);
  const ids = new Set();
  const SAFE_ID = /^[\w-]{1,64}$/;   // id 會寫進 HTML 屬性，只收英數、底線、連字號（防 XSS）
  const okId = (id, p) => { const v = (typeof id === 'string' && SAFE_ID.test(id) && !ids.has(id)) ? id : uid(p); ids.add(v); return v; };
  const nodeMap = new Map();   // 匯入的原始節點 id → 實際使用的 id
  for (const p of (Array.isArray(d.plates) ? d.plates : [])) out.plates.push({
    id: okId(p.id, 'p'), x: num(p.x, 0), y: num(p.y, 0), w: Math.max(40, num(p.w, 200)), d: Math.max(40, num(p.d, 200)),
    label: String(p.label ?? ''), color: isHex(p.color) ? p.color : '' });
  for (const n of (Array.isArray(d.nodes) ? d.nodes : [])) {
    const type = SHAPES[n.type] ? n.type : 'box', def = SHAPES[type].def;
    const nidNew = okId(n.id, 'n'); if (typeof n.id === 'string' && !nodeMap.has(n.id)) nodeMap.set(n.id, nidNew);
    out.nodes.push({ id: nidNew, type, x: num(n.x, 0), y: num(n.y, 0), h: Math.max(4, num(n.h, def.h)),
      size: Math.min(3, Math.max(.3, num(n.size, 1))), color: isHex(n.color) ? n.color : def.color,
      icon: String(n.icon ?? def.icon), name: String(n.name ?? SHAPES[type].name), sub: String(n.sub ?? '') });
  }
  const ref = v => nodeMap.get(v);   // 只認得匯入檔裡真的存在的節點
  for (const e of (Array.isArray(d.edges) ? d.edges : [])) {
    const a = ref(e && e.a), b = ref(e && e.b);
    if (!a || !b || a === b) continue;
    out.edges.push({ id: okId(e.id, 'e'), a, b, label: String(e.label ?? ''), color: isHex(e.color) ? e.color : '',
      mode: ['air', 'ground-xy', 'ground-yx'].includes(e.mode) ? e.mode : 'air', dash: !!e.dash });
  }
  for (const s of (Array.isArray(d.steps) ? d.steps : [])) out.steps.push({
    id: okId(s.id, 's'), type: STEP_TYPES[s.type] ? s.type : 'req', short: String(s.short ?? ''), title: String(s.title ?? ''),
    desc: String(s.desc ?? ''), cap: String(s.cap ?? ''), code: String(s.code ?? ''),
    hops: (Array.isArray(s.hops) ? s.hops : []).map(h => h && { a: ref(h.a), b: ref(h.b), label: String(h.label ?? '') })
      .filter(h => h && h.a && h.b && h.a !== h.b) });
  return out;
}

/* ---------- 渲染：把整份文件畫進 svg（只改內容，不動 viewBox） ----------
   st = { step, sel:Set, handles, link:{from,to:[x,y]} } */
function render(svg, doc, st = {}) {
  const th = themeOf(doc), pj = proj(doc.rot), d = Draw(pj, th);
  const sel = st.sel || new Set(), step = (st.step >= 0 && doc.steps[st.step]) ? st.step : -1;
  const N = Object.fromEntries(doc.nodes.map(n => [n.id, n]));
  const top = n => (SHAPES[n.type] || SHAPES.box).top(n);
  const anchor = n => d.P(n.x, n.y, top(n) * 0.5);
  const edgePts = e => {
    const A = N[e.a], B = N[e.b]; if (!A || !B) return null;
    if (e.mode === 'ground-xy' || e.mode === 'ground-yx') {
      const m = e.mode === 'ground-xy' ? [B.x, A.y] : [A.x, B.y];
      return [d.P(A.x, A.y, 4), d.P(m[0], m[1], 4), d.P(B.x, B.y, 4)];
    }
    return [anchor(A), anchor(B)];
  };
  const edgeOf = (a, b) => doc.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
  const hopPts = h => {
    const A = N[h.a], B = N[h.b]; if (!A || !B) return null;
    const e = edgeOf(h.a, h.b); if (!e) return [anchor(A), anchor(B)];
    const p = edgePts(e); return e.a === h.a ? p : p.slice().reverse();
  };
  const pathD = p => 'M' + p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L');

  /* 步驟狀態 */
  const pairSt = {}, onNodes = new Set();
  let stepColor = th.accent;
  if (step >= 0) {
    stepColor = (STEP_TYPES[doc.steps[step].type] || STEP_TYPES.req).c;
    doc.steps.forEach((sp, i) => sp.hops.forEach(h => {
      const k = pairKey(h.a, h.b), c = (STEP_TYPES[sp.type] || STEP_TYPES.req).c;
      if (i === step) { pairSt[k] = { s: 'active', c }; onNodes.add(h.a); onNodes.add(h.b); }
      else if (i < step && (!pairSt[k] || pairSt[k].s !== 'active')) pairSt[k] = { s: 'done', c };
      else if (!pairSt[k]) pairSt[k] = { s: 'future' };
    }));
  }

  let out = '';
  /* 1. 區域平台 */
  const plateOrder = doc.plates.slice().sort((a, b) => pj.depth(a.x + a.w / 2, a.y + a.d / 2) - pj.depth(b.x + b.w / 2, b.y + b.d / 2));
  for (const p of plateOrder) {
    const col = p.color || th.plate;
    let s = d.prism(rect(p.x, p.y, p.w, p.d), -10, 10, col).svg;
    for (let gx = p.x + 40; gx < p.x + p.w - 1; gx += 40) { const a = d.P(gx, p.y), b = d.P(gx, p.y + p.d); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${th.grid}" stroke-width="1" pointer-events="none"/>`; }
    for (let gy = p.y + 40; gy < p.y + p.d - 1; gy += 40) { const a = d.P(p.x, gy), b = d.P(p.x + p.w, gy); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${th.grid}" stroke-width="1" pointer-events="none"/>`; }
    if (p.label) {
      const rc = rect(p.x, p.y, p.w, p.d).map(q => pj.R(q[0], q[1]));
      const minA = Math.min(...rc.map(q => q[0])), maxB = Math.max(...rc.map(q => q[1]));
      const [tx, ty] = d.P0(minA + 14, maxB - 12, 0);
      s += `<text transform="matrix(${C},${S},${-C},${S},${tx.toFixed(1)},${ty.toFixed(1)})" font-size="15" font-weight="700" fill="${th.plateText}" letter-spacing="2" pointer-events="none">${esc(p.label)}</text>`;
    }
    out += `<g class="iso-plate" data-id="${esc(p.id)}">${s}</g>`;
    if (sel.has(p.id)) {
      const q = rect(p.x, p.y, p.w, p.d).map(c => d.P(c[0], c[1], 0));
      out += `<polygon class="iso-sel" points="${d.pts(q)}" fill="none" stroke="${th.accent}" stroke-width="2.5" pointer-events="none"/>`;
    }
  }
  /* 2. 連線 */
  const labels = [];
  for (const e of doc.edges) {
    const p = edgePts(e); if (!p) continue;
    const ps = pairSt[pairKey(e.a, e.b)];
    let attr;
    if (step < 0) attr = `stroke="${e.color || th.edge}" stroke-width="2.6"${e.dash ? ' stroke-dasharray="7 6"' : ''}`;
    else if (!ps) attr = `stroke="${th.future}" stroke-width="2" opacity=".7"`;
    else if (ps.s === 'active') attr = `class="iso-flow" stroke="${ps.c}" stroke-width="4"`;
    else if (ps.s === 'done') attr = `stroke="${ps.c}" stroke-width="2.6" opacity=".45"`;
    else attr = `stroke="${th.future}" stroke-width="2" stroke-dasharray="3 7"`;
    if (sel.has(e.id)) out += `<path d="${pathD(p)}" fill="none" stroke="${th.accent}" stroke-width="10" opacity=".28" stroke-linecap="round" stroke-linejoin="round"/>`;
    out += `<path d="${pathD(p)}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${attr} pointer-events="none"/>`;
    out += `<path class="iso-hit" data-id="${esc(e.id)}" d="${pathD(p)}" fill="none" stroke="transparent" stroke-width="16"/>`;
    if (e.label) labels.push([e, p]);
  }
  /* 3. 節點（依深度排序，遠的先畫） */
  const order = doc.nodes.slice().sort((a, b) => pj.depth(a.x, a.y) - pj.depth(b.x, b.y));
  for (const n of order) {
    const sh = SHAPES[n.type] || SHAPES.box, s = n.size || 1, [gx, gy] = d.P(n.x, n.y, 0), rx = sh.foot * s * 1.45;
    if (onNodes.has(n.id)) out += `<ellipse class="iso-pulse" cx="${gx}" cy="${gy}" rx="${rx}" ry="${rx * 0.58}" fill="none" stroke="${stepColor}" stroke-width="3" pointer-events="none"/>`;
    if (sel.has(n.id)) out += `<ellipse class="iso-sel" cx="${gx}" cy="${gy}" rx="${rx * 0.95}" ry="${rx * 0.55}" fill="${th.accent}" fill-opacity=".1" stroke="${th.accent}" stroke-width="2.5" pointer-events="none"/>`;
    let g = sh.draw(d, n, s);
    if (n.icon) { const big = [...n.icon].length <= 2; g += d.text(n.x, n.y, top(n), n.icon, big ? 20 : 12, 700); }
    out += `<g class="iso-node${onNodes.has(n.id) ? ' on' : ''}" data-id="${esc(n.id)}">${g}</g>`;
  }
  /* 4. 名稱標籤 */
  for (const n of doc.nodes) {
    if (!n.name && !n.sub) continue;
    const sh = SHAPES[n.type] || SHAPES.box, s = n.size || 1, [gx, gy] = d.P(n.x, n.y, 0), y = gy + sh.foot * s * 0.8 + 22;
    const w = Math.max(textW(n.name, 15), textW(n.sub, 12)) + 24, h = n.sub ? 42 : 28;
    const stc = sel.has(n.id) ? th.accent : onNodes.has(n.id) ? stepColor : th.ink;
    d.grow(gx - w / 2, y - 15); d.grow(gx + w / 2, y - 15 + h);
    out += `<g class="iso-node" data-id="${esc(n.id)}"><rect x="${(gx - w / 2).toFixed(1)}" y="${(y - 15).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="10" fill="${th.pill}" stroke="${stc}" stroke-width="2"/>` +
      `<text x="${gx.toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700" fill="${th.ink}">${esc(n.name)}</text>` +
      (n.sub ? `<text x="${gx.toFixed(1)}" y="${(y + 18).toFixed(1)}" text-anchor="middle" font-size="12" fill="${th.muted}">${esc(n.sub)}</text>` : '') + `</g>`;
  }
  /* 5. 連線文字 */
  for (const [e, p] of labels) {
    const m = along(p, .5, 0), w = textW(e.label, 12) + 16;
    out += `<g class="iso-hit" data-id="${esc(e.id)}"><rect x="${(m[0] - w / 2).toFixed(1)}" y="${(m[1] - 11).toFixed(1)}" width="${w.toFixed(1)}" height="22" rx="11" fill="${th.pill}" stroke="${e.color || th.edge}" stroke-width="1.6"/>` +
      `<text x="${m[0].toFixed(1)}" y="${(m[1] + 1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="${th.ink}">${esc(e.label)}</text></g>`;
  }
  /* 6. 編輯用控制點 */
  if (st.handles) {
    const one = sel.size === 1 ? [...sel][0] : null;
    if (one && N[one]) {
      const n = N[one], [hx, hy] = d.P(n.x, n.y, top(n) + 30);
      out += `<g data-handle="link"><line x1="${hx}" y1="${hy + 10}" x2="${hx}" y2="${hy + 22}" stroke="${th.accent}" stroke-width="2"/><circle cx="${hx}" cy="${hy}" r="11" fill="${th.accent}" stroke="#fff" stroke-width="2"/><text x="${hx}" y="${hy + 1}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="16" font-weight="700" pointer-events="none">+</text></g>`;
    }
    const pl = one && doc.plates.find(p => p.id === one);
    if (pl) {
      const a = d.P(pl.x, pl.y, 0), b = d.P(pl.x + pl.w, pl.y + pl.d, 0);
      out += `<circle data-handle="p0" cx="${a[0]}" cy="${a[1]}" r="8" fill="#fff" stroke="${th.accent}" stroke-width="3"/>`;
      out += `<circle data-handle="p1" cx="${b[0]}" cy="${b[1]}" r="8" fill="#fff" stroke="${th.accent}" stroke-width="3"/>`;
    }
    if (st.link && N[st.link.from]) {
      const a = anchor(N[st.link.from]);
      out += `<line x1="${a[0]}" y1="${a[1]}" x2="${st.link.to[0]}" y2="${st.link.to[1]}" stroke="${th.accent}" stroke-width="3" stroke-dasharray="8 6" pointer-events="none"/>`;
    }
  }
  /* 7. 封包（播放時才會顯示） */
  out += `<g id="iso-pkt" style="display:none" pointer-events="none"><rect id="iso-pktR" x="-30" y="-13" width="60" height="26" rx="13" stroke="${th.stroke}" stroke-width="2"/><text id="iso-pktT" x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#fff"></text></g>`;

  svg.innerHTML = `<defs>${d.defs}</defs>` + out;
  svg.setAttribute('font-family', 'Cascadia Mono, Consolas, Microsoft JhengHei, monospace');
  return { bounds: d.bb, hopPts, pj, anchor: id => N[id] && anchor(N[id]) };
}

/* 折線上比例 u 的位置，off 為往行進方向左側的偏移量 */
function along(pts, u, off = 9) {
  const seg = []; let L = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); L += l; }
  let t = Math.max(0, Math.min(1, u)) * L;
  for (let i = 0; i < seg.length; i++) {
    if (t <= seg[i] || i === seg.length - 1) {
      const a = pts[i], b = pts[i + 1], l = seg[i] || 1, f = Math.min(1, t / l), dx = b[0] - a[0], dy = b[1] - a[1];
      return [a[0] + dx * f - dy / l * off, a[1] + dy * f + dx / l * off];
    }
    t -= seg[i];
  }
  return pts[0];
}

/* ---------- 相機：只管 viewBox（縮放、平移、適配） ---------- */
function Camera(svg, onChange) {
  const cam = { x: -400, y: -300, z: 1 };
  const box = () => svg.getBoundingClientRect();
  cam.apply = () => { const r = box(); svg.setAttribute('viewBox', `${cam.x} ${cam.y} ${Math.max(1, r.width) / cam.z} ${Math.max(1, r.height) / cam.z}`); onChange && onChange(cam); };
  cam.fit = (bb, pad = 50) => {
    const r = box();
    if (!bb || !isFinite(bb[0])) { cam.z = 1; cam.x = -r.width / 2; cam.y = -r.height / 2; return cam.apply(); }
    const bw = bb[2] - bb[0] + pad * 2, bh = bb[3] - bb[1] + pad * 2;
    cam.z = Math.max(.1, Math.min(r.width / bw, r.height / bh, 2.5));
    cam.x = (bb[0] + bb[2]) / 2 - r.width / cam.z / 2; cam.y = (bb[1] + bb[3]) / 2 - r.height / cam.z / 2;
    cam.apply();
  };
  cam.toSvg = (cx, cy) => { const r = box(); return [cam.x + (cx - r.left) / cam.z, cam.y + (cy - r.top) / cam.z]; };
  cam.zoomAt = (f, cx, cy) => {
    const r = box(); if (cx == null) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
    const [px, py] = cam.toSvg(cx, cy);
    cam.z = Math.max(.1, Math.min(5, cam.z * f));
    cam.x = px - (cx - r.left) / cam.z; cam.y = py - (cy - r.top) / cam.z; cam.apply();
  };
  cam.setZoom = z => cam.zoomAt(z / cam.z);
  cam.panBy = (dx, dy) => { cam.x -= dx / cam.z; cam.y -= dy / cam.z; cam.apply(); };
  cam.center = () => { const r = box(); return [cam.x + r.width / cam.z / 2, cam.y + r.height / cam.z / 2]; };
  return cam;
}

function applyThemeVars(el, th) {
  for (const k of ['bg', 'card', 'ink', 'muted', 'soft', 'accent', 'dot']) el.style.setProperty('--' + k, th[k]);
}

return { C, S, TXT, STEP_TYPES, THEMES, THEME_ORDER, CUSTOM_FIELDS, themeOf, customFrom, SHAPES, shade, esc, textW, isHex, pairKey, proj, normalize, render, along, Camera, applyThemeVars, uid };
})();
</script>

<script type="text/plain" id="viewer-css">
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cascadia Mono",Consolas,"Microsoft JhengHei",monospace}
.wrap{max-width:1500px;margin:0 auto;padding:16px 22px 28px}
.crumb{color:var(--muted);font-size:13px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:6px 0 4px}
h1{font-size:28px;margin:0}
.tag{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--card)}
.sub{color:var(--muted);font-size:14px;margin:4px 0 12px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card{border:2px solid var(--soft);border-left:5px solid var(--c);border-radius:10px;padding:6px 14px;background:var(--card);min-width:140px}
.card .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.card .v{font-weight:700;font-size:16px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.main.nosteps{grid-template-columns:1fr}
.stage{border:2px solid var(--soft);border-radius:14px;background:radial-gradient(circle,var(--dot) 1px,transparent 1.2px) 0 0/22px 22px,var(--card);position:relative;overflow:hidden;height:min(68vh,680px);min-height:360px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
.stage svg.drag{cursor:grabbing}
.legend{position:absolute;left:14px;bottom:10px;display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoom button{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);padding:2px 9px;cursor:pointer}
.panel{border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.badge{font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px;align-self:flex-start}
.panel h2{margin:0;font-size:20px}
.panel p{margin:0;font-size:14px;line-height:1.65;white-space:pre-wrap}
.code{border:2px solid var(--ink);border-radius:10px;background:var(--bg);padding:10px 12px}
.code .cap{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.code pre{margin:0;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-family:inherit}
.ctrl{display:flex;gap:8px;margin-top:auto}
.ctrl button{flex:1;font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);padding:8px;cursor:pointer}
.ctrl button:hover,.zoom button:hover{background:var(--soft)}
.tl{margin-top:16px;border-top:2px solid var(--soft);padding-top:12px}
.tl .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.steps{display:flex;align-items:flex-start;position:relative}
.steps::before{content:"";position:absolute;left:18px;right:18px;top:17px;height:3px;background:var(--soft)}
.steps .fill{position:absolute;left:18px;top:17px;height:3px;background:var(--ink);transition:width .4s}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;font-size:12px;text-align:center;color:var(--muted)}
.st b{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font-size:14px;color:var(--ink)}
.st.on b{background:var(--c);color:#fff;transform:scale(1.12)}
.st.done b{background:var(--soft)}
.st.on{color:var(--ink);font-weight:700}
@media (max-width:980px){.main{grid-template-columns:1fr}}
@media (max-width:600px){.wrap{padding:12px 16px}h1{font-size:22px}.st span{display:none}.stage{height:56vh}}
</script>

<script type="text/plain" id="viewer-js">
(() => {
'use strict';
const doc = ISO.normalize(JSON.parse(document.getElementById('doc-json').textContent));
const th = ISO.themeOf(doc), T = ISO.STEP_TYPES, esc = ISO.esc, steps = doc.steps;
/* 介面文字：匯出當下編輯器的語言（window.ISO_L10N），沒有就用英文 */
const L = Object.assign({ steps: '⏱ {n} steps', zoomOut: 'Zoom out', fit: 'Fit', fitTitle: 'Fit (or double-click the canvas)', zoomIn: 'Zoom in',
  prev: '◀ Prev', next: 'Next ▶', play: '▶ Play', pause: '❚❚ Pause', inFlow: 'IN THIS FLOW', step: 'Step {n}',
  badge: 'STEP {n} / {t}', count: 'Step {n} of {t}' }, window.ISO_L10N || {});
const fmt = (k, v) => String(L[k]).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] != null) ? v[x] : m);
if (L.types) for (const k of Object.keys(L.types)) if (T[k]) T[k].n = L.types[k];
if (L.lang) document.documentElement.lang = L.lang;
ISO.applyThemeVars(document.documentElement, th);
const used = [...new Set(steps.map(s => s.type))];
document.getElementById('root').innerHTML = `<div class="wrap">
  ${doc.crumb ? `<div class="crumb">${esc(doc.crumb)}</div>` : ''}
  <div class="head"><h1>${esc(doc.title)}</h1>${steps.length ? `<span class="tag">${esc(fmt('steps', { n: steps.length }))}</span>` : ''}${doc.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${doc.subtitle ? `<div class="sub">${esc(doc.subtitle)}</div>` : ''}
  ${doc.cards.length ? `<div class="cards">${doc.cards.map(c => `<div class="card" style="--c:${(T[c.type] || {}).c || th.muted}"><div class="k">${esc(c.k)}</div><div class="v">${esc(c.v)}</div></div>`).join('')}</div>` : ''}
  <div class="main ${steps.length ? '' : 'nosteps'}">
    <div class="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">${used.map(t => `<span><i style="background:${T[t].c}"></i>${esc(T[t].n)}</span>`).join('')}</div>
      <div class="zoom"><button data-z="out" title="${esc(L.zoomOut)}">−</button><button data-z="fit" title="${esc(L.fitTitle)}">${esc(L.fit)}</button><button data-z="in" title="${esc(L.zoomIn)}">＋</button></div></div>
    ${steps.length ? `<div class="panel" id="panel"><span class="badge" id="pBadge"></span><h2 id="pTitle"></h2><p id="pDesc"></p>
      <div class="code" id="pCodeBox"><div class="cap" id="pCap"></div><pre id="pCode"></pre></div>
      <div class="ctrl"><button id="bPrev">${esc(L.prev)}</button><button id="bPlay"></button><button id="bNext">${esc(L.next)}</button></div></div>` : ''}
  </div>
  ${steps.length ? `<div class="tl"><div class="row"><span>${esc(L.inFlow)}</span><span id="tlCount"></span></div><div class="steps" id="steps"><div class="fill" id="fill"></div></div></div>` : ''}
</div>`;
const $ = id => document.getElementById(id), svg = $('svg'), cam = ISO.Camera(svg);
let res = ISO.render(svg, doc, { step: steps.length ? 0 : -1 });
const fit = () => cam.fit(res.bounds);
fit();
let userMoved = false;
new ResizeObserver(() => userMoved ? cam.apply() : fit()).observe(svg);
svg.addEventListener('wheel', e => { e.preventDefault(); userMoved = true; cam.zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
let pan = null;
svg.addEventListener('pointerdown', e => { pan = [e.clientX, e.clientY]; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e => { if (!pan) return; userMoved = true; cam.panBy(e.clientX - pan[0], e.clientY - pan[1]); pan = [e.clientX, e.clientY]; });
svg.addEventListener('pointerup', () => { pan = null; svg.classList.remove('drag'); });
svg.addEventListener('dblclick', () => { userMoved = false; fit(); });
document.querySelector('.zoom').addEventListener('click', e => {
  const z = e.target.dataset.z; if (!z) return;
  if (z === 'fit') { userMoved = false; fit(); } else { userMoved = true; cam.zoomAt(z === 'in' ? 1.2 : 1 / 1.2); }
});
if (window.parent !== window) document.addEventListener('keydown', e => { if (e.key === 'Escape') window.parent.postMessage('iso-close', '*'); });
if (!steps.length) return;

const stepsEl = $('steps');
steps.forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'st'; d.style.setProperty('--c', T[s.type].c);
  d.innerHTML = `<b>${i + 1}</b><span>${esc(s.short || s.title || fmt('step', { n: i + 1 }))}</span>`;
  d.onclick = () => go(i, true); stepsEl.appendChild(d);
});
let cur = 0, playing = doc.autoplay, t0 = performance.now();
const HOP = Math.max(200, doc.speed), PAUSE = 900;
const setPlayLbl = () => { $('bPlay').textContent = playing ? L.pause : L.play; };
function go(i, manual) {
  cur = (i + steps.length) % steps.length; t0 = performance.now();
  if (manual) playing = false;
  setPlayLbl();
  res = ISO.render(svg, doc, { step: cur });
  const s = steps[cur], col = T[s.type].c;
  $('panel').style.setProperty('--c', col);
  $('pBadge').textContent = fmt('badge', { n: cur + 1, t: steps.length });
  $('pTitle').textContent = s.title || s.short || fmt('step', { n: cur + 1 });
  $('pDesc').textContent = s.desc;
  $('pCodeBox').style.display = (s.cap || s.code) ? '' : 'none';
  $('pCap').textContent = s.cap; $('pCode').textContent = s.code;
  $('tlCount').textContent = fmt('count', { n: cur + 1, t: steps.length });
  [...stepsEl.querySelectorAll('.st')].forEach((d, j) => { d.classList.toggle('on', j === cur); d.classList.toggle('done', j < cur); });
  $('fill').style.width = steps.length > 1 ? `calc((100% - 36px) * ${cur / (steps.length - 1)})` : '0';
  $('iso-pktR').setAttribute('fill', col);
}
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
let lastLabel = null;
function tick(now) {
  let s = steps[cur], el = Math.max(0, now - t0);
  if (el >= s.hops.length * HOP + PAUSE) {
    if (playing) go(cur + 1); else t0 = now;
    el = 0; s = steps[cur]; lastLabel = null;
  }
  const k = Math.floor(el / HOP), pkt = $('iso-pkt');
  if (pkt && k < s.hops.length) {
    const h = s.hops[k], pts = res.hopPts(h);
    if (pts) {
      const p = ISO.along(pts, ease((el - k * HOP) / HOP));
      pkt.style.display = ''; pkt.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
      const label = h.label || '•';
      if (label !== lastLabel || $('iso-pktT').textContent !== label) {
        lastLabel = label; $('iso-pktT').textContent = label; const w = ISO.textW(label, 12) + 22;
        $('iso-pktR').setAttribute('x', -w / 2); $('iso-pktR').setAttribute('width', w);
      }
    }
  } else if (pkt) pkt.style.display = 'none';
  requestAnimationFrame(tick);
}
$('bPrev').onclick = () => go(cur - 1, true);
$('bNext').onclick = () => go(cur + 1, true);
$('bPlay').onclick = () => { playing = !playing; setPlayLbl(); t0 = performance.now(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(cur + 1, true);
  else if (e.key === 'ArrowLeft') go(cur - 1, true);
  else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); }
});
const q = +(new URLSearchParams(location.search).get('step') || window.ISO_START || 0);
go(q ? Math.max(0, Math.min(steps.length - 1, q - 1)) : 0, !!q);
requestAnimationFrame(tick);
})();
</script>

/* ---------- 狀態 ---------- */
let doc, last, undoS = [], redoS = [];
let sel = new Set(), tab = 'prop', stepSel = -1;
let drag = null, link = null, pan = null, spaceDown = false, lastRes = null;
const svg = $('cv'), stage = $('stage');
const cam = Camera(svg, c => { $('zoomLbl').textContent = Math.round(c.z * 100) + '%'; });

const findN = id => doc.nodes.find(n => n.id === id);
const findP = id => doc.plates.find(p => p.id === id);
const findE = id => doc.edges.find(e => e.id === id);
const pj = () => ISO.proj(doc.rot);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }
function save() { try { localStorage.setItem(LS_KEY, last); } catch (e) { toast(T('toast.saveFail')); } }
function commit() {
  const now = JSON.stringify(doc);
  if (now === last) return;
  undoS.push(last); if (undoS.length > MAX_UNDO) undoS.shift();
  redoS = []; last = now; save(); updUndo();
}
function updUndo() { $('bUndo').disabled = !undoS.length; $('bRedo').disabled = !redoS.length; }
function restore(json) {
  doc = normalize(JSON.parse(json)); last = JSON.stringify(doc); save();
  sel = new Set([...sel].filter(id => findN(id) || findP(id) || findE(id)));
  if (stepSel >= doc.steps.length) stepSel = doc.steps.length - 1;
  applyTheme(); draw(); refreshPanel(); updUndo();
}
function undo() { if (!undoS.length) return; redoS.push(last); restore(undoS.pop()); }
function redo() { if (!redoS.length) return; undoS.push(last); restore(redoS.pop()); }
function loadDoc(d, fit = true) {
  doc = normalize(d); sel.clear(); stepSel = doc.steps.length ? 0 : -1;
  applyTheme(); draw(); if (fit) fitView(); refreshPanel();
}
function applyTheme() { applyThemeVars(document.documentElement, themeOf(doc)); $('selTheme').value = doc.theme; }
const themeOptions = cur => THEME_ORDER.map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(THEMES[k].name)}</option>`).join('') +
  `<option value="custom" ${cur === 'custom' ? 'selected' : ''}>${esc(T('theme.customPick'))}</option>`;
/* 記住偏好：下次沒有存檔、或開新範本時，用你最後選的主題 */
function savePref() { try { localStorage.setItem(LS_PREF, JSON.stringify({ theme: doc.theme, customTheme: doc.customTheme })); } catch (e) { } }
function loadPref() { try { return JSON.parse(localStorage.getItem(LS_PREF) || 'null'); } catch (e) { return null; } }
function setTheme(key) {
  const prev = doc.theme;
  if (key === 'custom' && !doc.customTheme.edited && prev !== 'custom') doc.customTheme = { ...customFrom(prev), edited: false };   // 第一次切自訂：以目前主題當起點
  doc.theme = key; commit(); savePref(); applyTheme(); draw(); refreshPanel();
  if (key === 'custom') { setTab('doc'); toast(T('toast.customHint')); }
  else toast(T('toast.theme', { name: THEMES[key].name }));
}

/* ---------- 繪製 ---------- */
function draw() {
  lastRes = render(svg, doc, { sel, step: tab === 'step' ? stepSel : -1, handles: true, link });
  drawTimeline();
}
function fitView() { draw(); cam.fit(lastRes.bounds); }

function drawTimeline() {
  const box = $('tlSteps');
  $('tlInfo').textContent = doc.steps.length ? T('tl.info', { n: doc.steps.length }) : T('tl.empty');
  box.innerHTML = doc.steps.map((s, i) => `<div class="tls ${tab === 'step' && i === stepSel ? 'on' : ''}" data-i="${i}" title="${esc(s.title)}"><b style="background:${STEP_TYPES[s.type].c}">${i + 1}</b>${esc(s.short || s.title || T('step.n', { n: i + 1 }))}</div>`).join('');
}
$('tlSteps').addEventListener('click', e => { const t = e.target.closest('.tls'); if (!t) return; stepSel = +t.dataset.i; setTab('step'); });
$('bAddStep').onclick = () => addStep();

/* ---------- 新增／刪除 ---------- */
function addNode(type, wx, wy) {
  const def = SHAPES[type].def;
  const n = { id: uid('n'), type, x: Math.round(wx / GRID) * GRID, y: Math.round(wy / GRID) * GRID, h: def.h, size: 1, color: def.color, icon: def.icon, name: SHAPES[type].name, sub: '' };
  doc.nodes.push(n); sel = new Set([n.id]); setTab('prop', false); commit(); draw(); refreshPanel();
}
function addPlate(wx, wy) {
  const p = { id: uid('p'), x: Math.round((wx - 120) / GRID) * GRID, y: Math.round((wy - 120) / GRID) * GRID, w: 240, d: 240, label: T('new.plate'), color: '' };
  doc.plates.push(p); sel = new Set([p.id]); setTab('prop', false); commit(); draw(); refreshPanel();
}
function addStep() {
  doc.steps.push({ id: uid('s'), type: 'req', short: T('step.n', { n: doc.steps.length + 1 }), title: '', desc: '', cap: '', code: '', hops: [] });
  stepSel = doc.steps.length - 1; commit(); setTab('step');
  toast(T('toast.addStep'));
}
function deleteSel() {
  if (!sel.size) return;
  const nodes = new Set([...sel].filter(findN));
  doc.nodes = doc.nodes.filter(n => !nodes.has(n.id));
  doc.plates = doc.plates.filter(p => !sel.has(p.id));
  doc.edges = doc.edges.filter(e => !sel.has(e.id) && !nodes.has(e.a) && !nodes.has(e.b));
  doc.steps.forEach(s => s.hops = s.hops.filter(h => !nodes.has(h.a) && !nodes.has(h.b)));
  sel.clear(); commit(); draw(); refreshPanel();
}
function duplicateSel() {
  const map = {}, add = [];
  for (const id of sel) {
    const n = findN(id), p = findP(id);
    if (n) { const c = { ...n, id: uid('n'), x: n.x + 40, y: n.y + 40 }; map[n.id] = c.id; doc.nodes.push(c); add.push(c.id); }
    if (p) { const c = { ...p, id: uid('p'), x: p.x + 40, y: p.y + 40 }; doc.plates.push(c); add.push(c.id); }
  }
  for (const e of doc.edges.slice()) if (map[e.a] && map[e.b]) doc.edges.push({ ...e, id: uid('e'), a: map[e.a], b: map[e.b] });
  if (!add.length) return;
  sel = new Set(add); commit(); draw(); refreshPanel();
}
function nudge(da, db) {
  // da／db 是「旋轉後」的世界軸位移（整數）；(+1,-1) 在畫面上剛好是正右方，(+1,+1) 是正下方
  // 只用整數格移動，原本在 10 格線上的東西用 Shift（10）移動後仍在格線上
  const [wx, wy] = pj().Ri(da, db);
  for (const id of sel) { const o = findN(id) || findP(id); if (o) { o.x += wx; o.y += wy; } }
  draw(); commit();
}

/* ---------- 複製／貼上（Ctrl+C／Ctrl+V，也會寫進系統剪貼簿，另一個視窗可以貼） ---------- */
let clip = null, lastClickW = null, pasteKey = null, pasteN = 0, pendingPaste = null;
function collectClip() {
  const nodes = doc.nodes.filter(n => sel.has(n.id)), plates = doc.plates.filter(p => sel.has(p.id));
  if (!nodes.length && !plates.length) return null;
  const ids = new Set(nodes.map(n => n.id));
  const edges = doc.edges.filter(e => ids.has(e.a) && ids.has(e.b));
  return JSON.parse(JSON.stringify({ kind: '25duml-clip', v: 1, nodes, plates, edges }));
}
function pasteClip(c) {
  if (!c) return;
  const src = normalize({ nodes: c.nodes, plates: c.plates, edges: c.edges });   // 從系統剪貼簿來的也要過濾
  const pts = [...src.nodes.map(n => [n.x, n.y]), ...src.plates.map(p => [p.x + p.w / 2, p.y + p.d / 2])];
  if (!pts.length) return;
  const cx = pts.reduce((a, q) => a + q[0], 0) / pts.length, cy = pts.reduce((a, q) => a + q[1], 0) / pts.length;
  let dx, dy;
  const key = lastClickW ? lastClickW.join(',') : 'none';
  pasteN = key === pasteKey ? pasteN + 1 : 0; pasteKey = key;
  if (lastClickW) { dx = lastClickW[0] - cx + pasteN * 30; dy = lastClickW[1] - cy + pasteN * 30; }   // 貼在最後點擊處，同一點連貼會階梯排開
  else { dx = 40 * (pasteN + 1); dy = 40 * (pasteN + 1); }
  dx = Math.round(dx / GRID) * GRID; dy = Math.round(dy / GRID) * GRID;
  const map = {}, add = [];
  for (const n of src.nodes) { const c2 = { ...n, id: uid('n'), x: n.x + dx, y: n.y + dy }; map[n.id] = c2.id; doc.nodes.push(c2); add.push(c2.id); }
  for (const p of src.plates) { const c2 = { ...p, id: uid('p'), x: p.x + dx, y: p.y + dy }; doc.plates.push(c2); add.push(c2.id); }
  for (const e of src.edges) if (map[e.a] && map[e.b]) doc.edges.push({ ...e, id: uid('e'), a: map[e.a], b: map[e.b] });
  sel = new Set(add); commit(); draw(); refreshPanel();
  toast(T('toast.pasted', { n: add.length }));
}
document.addEventListener('copy', e => {
  if (typing() || !$('ov').hidden) return;
  const c = collectClip(); if (!c) return;
  clip = c; e.preventDefault();
  try { e.clipboardData.setData('text/plain', JSON.stringify(c)); } catch (err) { }
  toast(T('toast.copied', { n: c.nodes.length + c.plates.length }));
});
document.addEventListener('paste', e => {
  if (typing() || !$('ov').hidden) return;
  clearTimeout(pendingPaste); pendingPaste = null;
  let c = null;
  try { const j = JSON.parse(e.clipboardData.getData('text/plain')); if (j && j.kind === '25duml-clip') c = j; } catch (err) { }
  c = c || clip; if (!c) return;
  e.preventDefault(); pasteClip(c);
});

  const r = render(tmp, d, {}), b = r.bounds;
  return `<svg viewBox="${b[0] - 6} ${b[1] - 6} ${b[2] - b[0] + 12} ${b[3] - b[1] + 12}">${tmp.innerHTML}</svg>`;
}
const PAL_ICONS = Object.fromEntries(Object.keys(SHAPES).map(k => [k, palIcon(k)]));
function buildPalette() {   // 換語言時重建（只換文字，圖示沿用）
  const dupName = nm => Object.values(SHAPES).filter(x => x.name === nm).length > 1;
  $('pal').innerHTML = Object.entries(SHAPES).map(([k, s]) => { const full = T('pal.shapeTitle', { name: s.name, desc: s.desc });
    return `<button data-type="${k}" title="${esc(full)}">${PAL_ICONS[k]}<span>${esc(dupName(s.name) ? full : s.name)}</span></button>`; }).join('');
  $('pal2').innerHTML = `<button data-type="plate" title="${esc(T('pal.plateTitle'))}"><svg viewBox="-100 -60 200 120"><polygon points="0,-50 87,0 0,50 -87,0" fill="#ece5d5" stroke="#2d2a24" stroke-width="3"/></svg><span>${esc(T('pal.plate'))}</span></button>`;
}
let palDrag = null;
for (const box of [$('pal'), $('pal2')]) box.addEventListener('pointerdown', e => {

/* ---------- 畫布互動 ---------- */
const snap = (v, alt) => alt ? Math.round(v) : Math.round(v / GRID) * GRID;
const kindOf = id => findN(id) ? 'node' : findP(id) ? 'plate' : findE(id) ? 'edge' : null;
const nodeInPlate = (n, p) => n.x >= p.x && n.x <= p.x + p.w && n.y >= p.y && n.y <= p.y + p.d;

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || (e.button === 0 && spaceDown)) { e.preventDefault(); startPan(e); return; }
  if (e.button !== 0) return;
  const [sx, sy] = cam.toSvg(e.clientX, e.clientY);
  const multi = e.shiftKey || e.ctrlKey || e.metaKey;
  lastClickW = pj().un(sx, sy).map(Math.round);
  const t = e.target.closest('[data-handle],[data-id]');
  if (!t) {
    const now = performance.now();
    if (lastEmpty && now - lastEmpty < 400) { lastEmpty = 0; fitView(); return; }   // 雙擊空白處＝適配
    lastEmpty = now;
    if (!multi && sel.size) { sel.clear(); draw(); refreshPanel(); }
    startPan(e); return;
  }
  lastEmpty = 0;
  if (t.dataset.handle === 'link') { link = { from: [...sel][0], to: [sx, sy] }; draw(); return; }
  if (t.dataset.handle === 'p0' || t.dataset.handle === 'p1') {
    const p = findP([...sel][0]); drag = { kind: 'resize', h: t.dataset.handle, p, o: { ...p }, moved: false }; return;
  }
  const id = t.dataset.id, kind = kindOf(id);
  if (kind === 'edge') {
    if (tab === 'step' && stepSel >= 0) { addHopFromEdge(id, e.altKey); return; }
    const now = performance.now();
    if (!multi && lastDown && lastDown.id === id && now - lastDown.t < 400) { lastDown = null; focusName(id); return; }
    lastDown = { id, t: now };
    if (multi) sel.has(id) ? sel.delete(id) : sel.add(id); else sel = new Set([id]);
    draw(); refreshPanel(); return;
  }
  if (multi) { sel.has(id) ? sel.delete(id) : sel.add(id); draw(); refreshPanel(); return; }
  // 自己判斷雙擊：第一下點擊會重畫 DOM，瀏覽器的 dblclick 不一定觸發
  const now = performance.now();
  if (lastDown && lastDown.id === id && now - lastDown.t < 400) { lastDown = null; focusName(id); return; }
  lastDown = { id, t: now };
  if (!sel.has(id)) { sel = new Set([id]); draw(); refreshPanel(); }
  // 準備拖曳：選到的節點／平台＋平台上的節點（按 Alt 只拖點到的那一個）
  const move = new Map();
  const only = e.altKey ? [id] : [...sel];
  for (const sid of only) {
    const n = findN(sid), p = findP(sid);
    if (n) move.set(n, { x: n.x, y: n.y });
    if (p) { move.set(p, { x: p.x, y: p.y }); if (!e.altKey) doc.nodes.forEach(nn => { if (nodeInPlate(nn, p)) move.set(nn, { x: nn.x, y: nn.y }); }); }
  }
  drag = { kind: 'move', w0: pj().un(sx, sy), move, moved: false };
});
function startPan(e) { pan = [e.clientX, e.clientY]; stage.classList.add('panning'); }
window.addEventListener('pointermove', e => {
  if (palDrag) {
    if (Math.hypot(e.clientX - palDrag.x, e.clientY - palDrag.y) > 6) palDrag.moved = true;
    if (palDrag.moved) stage.style.outline = '3px dashed var(--accent)';
    return;
  }
  if (pan) { if (Math.abs(e.clientX - pan[0]) + Math.abs(e.clientY - pan[1]) > 2) lastEmpty = 0; cam.panBy(e.clientX - pan[0], e.clientY - pan[1]); pan = [e.clientX, e.clientY]; return; }
  if (!drag && !link) return;
  const [sx, sy] = cam.toSvg(e.clientX, e.clientY);
  if (link) { link.to = [sx, sy]; draw(); return; }
  const w = pj().un(sx, sy);
  if (drag.kind === 'move') {
    const dx = snap(w[0] - drag.w0[0], e.altKey), dy = snap(w[1] - drag.w0[1], e.altKey);
    if (dx || dy) { drag.moved = true; lastDown = null; }   // 拖過就不算雙擊
    for (const [o, p0] of drag.move) { o.x = p0.x + dx; o.y = p0.y + dy; }
    draw();

    const p = drag.p, o = drag.o, wx = snap(w[0], e.altKey), wy = snap(w[1], e.altKey);

    else { const ex = o.x + o.w, ey = o.y + o.d; p.x = Math.min(wx, ex - 60); p.y = Math.min(wy, ey - 60); p.w = ex - p.x; p.d = ey - p.y; }

});

        if (n.id === from) continue;

let lastDown = null, lastEmpty = 0;
function focusName(id) {

const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); };
document.addEventListener('keydown', e => {
  if (!$('ov').hidden) { if (e.key === 'Escape') closePlay(); return; }
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (!['Shift', 'Alt', 'Control', 'Meta'].includes(e.key)) lastDown = null;
  if (ctrl && k === 's') { e.preventDefault(); exportJSON(); return; }
  if (typing()) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (ctrl && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (ctrl && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (ctrl && k === 'd') { e.preventDefault(); duplicateSel(); }
  else if (ctrl && k === 'c') { const c = collectClip(); if (c) clip = c; }   // 不擋預設動作，讓 copy 事件寫系統剪貼簿
  else if (ctrl && k === 'v') { clearTimeout(pendingPaste); pendingPaste = setTimeout(() => { pendingPaste = null; pasteClip(clip); }, 80); }   // paste 事件沒來（剪貼簿被擋）時的備援
  else if (ctrl && k === '0') { e.preventDefault(); cam.setZoom(1); }
  else if (ctrl && (k === '=' || k === '+')) { e.preventDefault(); cam.zoomAt(1.2); }
  else if (ctrl && (k === '-' || k === '_')) { e.preventDefault(); cam.zoomAt(1 / 1.2); }
  else if (ctrl && k === 'a') { e.preventDefault(); sel = new Set(doc.nodes.map(n => n.id)); draw(); refreshPanel(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); }
  else if (e.key === 'Escape') { link = null; drag = null; sel.clear(); draw(); refreshPanel(); }
  else if (e.key === ' ') { e.preventDefault(); spaceDown = true; stage.style.cursor = 'grab'; }
  else if (e.key.startsWith('Arrow') && sel.size) {
    e.preventDefault(); const s = e.shiftKey ? GRID : 1;
    const v = { ArrowRight: [s, -s], ArrowLeft: [-s, s], ArrowUp: [-s, -s], ArrowDown: [s, s] }[e.key];
    if (v) nudge(v[0], v[1]);

  else if (ctrl) return;
  else if (k === 'f') fitView();
  else if (k === 'r') rotate(e.shiftKey ? -1 : 1);
  else if (k === 't') { const i = THEME_ORDER.indexOf(doc.theme); setTheme(THEME_ORDER[(i + (e.shiftKey ? -1 : 1) + THEME_ORDER.length) % THEME_ORDER.length]); }

function download(name, blob) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fname = ext => (doc.title || '2.5DUML').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60) + ext;

function buildViewerHTML(d, startStep) {

async function exportPNG() {
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const r = render(tmp, doc, {}), b = r.bounds, pad = 30, th = themeOf(doc);
  if (!isFinite(b[0])) { toast(T('toast.empty')); return; }
  const w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2, scale = 2;
  const src = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b[0] - pad} ${b[1] - pad} ${w} ${h}" width="${w * scale}" height="${h * scale}" font-family="Cascadia Mono, Consolas, Microsoft JhengHei, monospace"><rect x="${b[0] - pad}" y="${b[1] - pad}" width="${w}" height="${h}" fill="${th.bg}"/>${[...tmp.childNodes].map(c => new XMLSerializer().serializeToString(c)).join('')}</svg>`;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
  try {
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = () => bad(new Error(T('err.svg'))); img.src = url; });
    const cv = document.createElement('canvas'); cv.width = Math.ceil(w * scale); cv.height = Math.ceil(h * scale);
    cv.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
    if (!blob) throw new Error(T('err.png'));
    download(fname('.png'), blob); toast(T('toast.pngOut'));
  } catch (err) { toast(T('toast.pngFail', { msg: err.message })); }
  finally { URL.revokeObjectURL(url); }
}
$('bPng').onclick = exportPNG;
